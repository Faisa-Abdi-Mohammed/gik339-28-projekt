<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CRUD – Filmer</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">

<main class="container py-4">
  <header class="mb-4">
    <h1 class="h3">Filmer (CRUD)</h1>
    <p class="text-muted mb-0">Skapa, visa, uppdatera och ta bort filmer.</p>
  </header>

  <div class="row g-4">
    <section class="col-12 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="h5">Formulär</h2>

          <form id="movieForm" class="mt-3">
            <input type="hidden" id="movieId" />

            <div class="mb-3">
              <label class="form-label" for="title">Titel</label>
              <input class="form-control" id="title" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="year">År</label>
              <input class="form-control" id="year" type="number" min="1888" max="2100" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="genre">Genre</label>
              <input class="form-control" id="genre" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="rating">Betyg (1–5)</label>
              <input class="form-control" id="rating" type="number" min="1" max="5" required />
            </div>

            <div class="d-flex gap-2">
              <button class="btn btn-primary" type="submit">Spara</button>
              <button class="btn btn-outline-secondary" type="button" id="clearBtn">Rensa</button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <section class="col-12 col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <h2 class="h5 mb-0">Lista</h2>
            <button class="btn btn-sm btn-outline-primary" id="refreshBtn">Uppdatera</button>
          </div>

          <div id="listMount" class="mt-3">
            <!-- Listan skapas dynamiskt i script.js -->
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

<!-- Modal -->
<div class="modal fade" id="messageModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Meddelande</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Stäng"></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Stäng</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
